# Boots the whole environment and runs its own self-checks.
#
# This tests VirtualOrg, not any kit: it proves the conditions the ground truth
# claims exist are genuinely observable through the vendor APIs. If it goes red,
# the generator and the lenses have drifted apart.
name: verify

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the checks' own dependencies
        run: pip install --quiet -r requirements-host.txt

      - name: Boot the world and the twins
        run: |
          cp .env.example .env
          docker compose up -d --build
          echo "waiting for the gateway and the control center"
          for i in $(seq 1 60); do
            curl -sf localhost:8080/healthz >/dev/null 2>&1 \
              && curl -sf localhost:3000/healthz >/dev/null 2>&1 && break
            sleep 3
          done

      - name: The world generated
        run: docker compose logs world-engine | tail -30

      - name: Self-checks
        run: python3 scripts/verify.py

      - name: Every Control Center surface renders
        run: |
          fail=0
          for u in / /asset /spine /lenses /org /groundtruth /scenario \
                   "/manual?ch=overview" "/manual?ch=model" "/manual?ch=reach" \
                   "/manual?ch=gaps" "/manual?ch=connect" "/manual?ch=api" \
                   "/manual?ch=correlate" "/manual?ch=scoring"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:3000$u")
            [ "$code" = "200" ] || { echo "FAIL $code $u"; fail=1; }
          done
          exit $fail

      - name: No Control Center page prints a credential
        run: |
          # The Control Center is unauthenticated by design, so it must never render
          # a token, not even the shipped default. Examples reference $VO_TOKEN.
          fail=0
          pages="/ /asset /spine /org /groundtruth /scenario /lenses /export/groundtruth"
          for l in servicenow splunk grc iam scanner hr edr; do pages="$pages /lenses/$l"; done
          for ch in overview model reach gaps connect api correlate scoring; do
            pages="$pages /manual?ch=$ch"
          done
          # parameterised detail pages, which the old list skipped entirely
          pages="$pages /asset/AST-0001 /spine/service/SVC-01 /spine/control/CTL-017"
          pages="$pages /org/person/EMP-0001 /org?tab=people /org?tab=controls"
          for u in $pages; do
            if curl -s "localhost:3000$u" | grep -q "vo-dev-token"; then
              echo "FAIL $u renders a literal token"; fail=1
            fi
          done
          [ $fail = 0 ] && echo "no page renders a credential"
          exit $fail

      - name: Rendered counts match the live world
        run: |
          # "Three views, one world" was written when there were three lenses and
          # silently became wrong at four. Any prose that states a count must read it.
          python3 - <<'EOF'
          import json, re, sys, urllib.request
          def get(u):
              return urllib.request.urlopen(u, timeout=20).read().decode()
          live = len(json.loads(get("http://localhost:8080/healthz"))["lenses"])
          words = {"one":1,"two":2,"three":3,"four":4,"five":5,"six":6,
                   "seven":7,"eight":8,"nine":9,"ten":10}
          h1 = re.search(r"<h1>([^<]*)</h1>", get("http://localhost:3000/lenses")).group(1)
          claimed = words.get(h1.split()[0].lower())
          print(f"lens page says {h1!r}; the world has {live} lenses")
          if claimed != live:
              sys.exit(f"FAIL: page claims {claimed}, world has {live}")
          print("counts agree")
          EOF

      - name: Documented numbers match the running system
        run: |
          # These have drifted twice. A number in the README that nothing checks is a
          # claim, not a fact, so check it.
          actual=$(python3 scripts/verify.py 2>&1 | grep -cE '^  (PASS|FAIL)')
          for f in README.md docs/index.html CHANGELOG.md; do
            claimed=$(grep -oE '[0-9]{2,3} self-checks' "$f" | head -1 | grep -oE '[0-9]+' || true)
            if [ -n "$claimed" ] && [ "$claimed" != "$actual" ]; then
              echo "$f says $claimed self-checks; the suite runs $actual"; exit 1
            fi
          done
          echo "self-check count agrees in every document: $actual"

          gv=$(curl -s -H "Authorization: Bearer vo-dev-token" localhost:8080/healthz \
               | python3 -c 'import sys,json;print(json.load(sys.stdin)["world"]["generator_version"])')
          doc=$(grep -oE '"generator_version": "[0-9]+"' scripts/score | head -1 | grep -oE '[0-9]+')
          [ "$gv" = "$doc" ] || { echo "scripts/score documents generator_version $doc; world is $gv"; exit 1; }
          echo "scorer's worked example matches the world: generator_version $gv"

      - name: No authoring-tool attribution anywhere
        run: |
          # Same rule as the long dash, and for the same reason: this is the author's
          # project and nothing in it should credit or name the tooling used to write
          # it. Covers tracked file content, commit messages and commit trailers.
          # Patterns are assembled at runtime so this file does not trip its own check.
          A=$(printf 'cl''aude'); B=$(printf 'anthro''pic'); C=$(printf 'co-auth''ored-by')
          D=$(printf 'open''ai'); E=$(printf 'chat''gpt'); F=$(printf 'co''pilot')
          PAT="$A|$B|$C|$D|$E|$F"
          hits=$(git ls-files | xargs grep -IlEi "$PAT" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "authoring-tool reference found in:"; echo "$hits"
            git ls-files | xargs grep -InEi "$PAT" 2>/dev/null | head -20
            exit 1
          fi
          if git log --format='%B' | grep -qEi "$PAT"; then
            echo "authoring-tool reference found in a commit message:"
            git log --format='%h %B' | grep -nEi "$PAT" | head -10
            exit 1
          fi
          echo "clean: no authoring-tool attribution in files or commit messages"

      - name: No em dashes in anything we author
        run: |
          # A hard rule, not a preference: the long dash reads as machine-written.
          # The character is built at runtime with printf so that this file does not
          # contain the very thing it bans and flag itself.
          DASH=$(printf '\u2014')
          hits=$(git ls-files | grep -v '^DESIGN.md$' | xargs grep -Il "$DASH" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "long dash found in:"; echo "$hits"
            git ls-files | grep -v '^DESIGN.md$' | xargs grep -In "$DASH" 2>/dev/null | head -20
            exit 1
          fi
          echo "clean: DESIGN.md keeps its own voice, everything else is free of it"

      - name: The reference kit runs and can be scored
        run: |
          python3 examples/reference-kit/kit.py > /tmp/posture.json
          python3 -c "import json;d=json.load(open('/tmp/posture.json'));print(f'{len(d[\"findings\"])} findings, {len(d[\"attributions\"])} attributions')"
          VO_CC_BASE=http://localhost:3000 ./scripts/score /tmp/posture.json

      - name: The chaos profile serves the happy path
        run: |
          docker compose --profile chaos up -d wiremock
          for i in $(seq 1 20); do
            curl -sf localhost:8090/__admin/mappings >/dev/null 2>&1 && break; sleep 2
          done
          curl -sf localhost:8090/healthz >/dev/null

      - name: Real OAuth actually validates
        run: |
          VO_AUTH_MODE=jwks docker compose up -d --force-recreate twin-gateway
          for i in $(seq 1 40); do curl -sf localhost:8080/healthz >/dev/null 2>&1 && break; sleep 3; done

          # Keycloak imports the realm on first boot and takes its time. Waiting on
          # the gateway alone is a race, and a flaky check is worse than no check.
          echo "waiting for the virtualorg realm"
          for i in $(seq 1 60); do
            curl -sf localhost:8081/realms/virtualorg >/dev/null 2>&1 && break
            sleep 3
          done
          curl -sf localhost:8081/realms/virtualorg >/dev/null \
            || { echo "Keycloak never published the realm"; docker compose logs keycloak | tail -40; exit 1; }

          RESP=$(curl -s -X POST localhost:8081/realms/virtualorg/protocol/openid-connect/token \
                 -d grant_type=client_credentials -d client_id=vo-kit -d client_secret=vo-kit-secret)
          TOK=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          [ -n "$TOK" ] || { echo "no token; Keycloak said: $RESP"; exit 1; }
          real=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
                 "localhost:8080/grc/api/v1/controls?limit=1")
          static=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer vo-dev-token" \
                   "localhost:8080/grc/api/v1/controls?limit=1")
          echo "real token=$real  static token=$static"
          [ "$real" = "200" ] && [ "$static" = "401" ]

      - name: The world is deterministic
        run: |
          # Hash the CONTENT of the tables that carry the world, not just their ids.
          # The previous version hashed expectation.id, which is sequential and
          # therefore a pure function of the row count: it could not have detected
          # non-determinism in any actual data.
          fingerprint() {
            docker compose exec -T world-db psql -U vo -d world -tAc "
              SELECT md5(string_agg(h, '' ORDER BY h)) FROM (
                SELECT md5(p::text) AS h FROM world.person p
                UNION ALL SELECT md5(a::text) FROM world.asset a
                UNION ALL SELECT md5(e::text) FROM world.evidence e
                UNION ALL SELECT md5(x::text) FROM world.expectation x
                UNION ALL SELECT md5(v::text) FROM world.vulnerability v
                UNION ALL SELECT md5(l::text) FROM world.lens_visibility l
                UNION ALL SELECT md5(c::text) FROM world.control_exception c
              ) t"
          }
          a=$(fingerprint)
          # Prove the generator actually ran and finished before fingerprinting again.
          # `sleep 10` was a race, and generate.py does TRUNCATE+INSERT in one
          # transaction, so a fingerprint taken mid-run returns the PRE-EXISTING rows:
          # identical by construction, and a silent false green on the one property
          # this project leads with.
          docker compose up -d --force-recreate world-engine
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' \
                 "$(docker compose ps -aq world-engine)" 2>/dev/null || echo "unknown:")
            case "$st" in
              exited:0) break;;
              exited:*) echo "world-engine failed: $st"; docker compose logs world-engine | tail -40; exit 1;;
            esac
            sleep 2
          done
          [ "${st%%:*}" = "exited" ] || { echo "world-engine did not finish in 120s"; exit 1; }
          echo "world-engine regenerated and exited cleanly"
          b=$(fingerprint)
          echo "before=$a"
          echo "after =$b"
          if [ "$a" != "$b" ]; then
            echo "The same seed produced a different world. Determinism is broken."
            exit 1
          fi
          echo "identical across a full regeneration"
          docker compose up -d --force-recreate twin-gateway
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz >/dev/null 2>&1 && break; sleep 2; done

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
